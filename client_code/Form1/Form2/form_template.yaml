components:
- data_bindings:
  - {code: '', property: font, writeback: false}
  layout_properties: {grid_position: 'EBNTGM,BYTYIU'}
  name: rich_text_1
  properties: {align: center, content: CB Bank  Loan Approval Prediction App, font_size: 20}
  type: RichText
- components:
  - layout_properties: {grid_position: 'SXXTDH,QBDMEL INDEQU,OPZVGF'}
    name: label_1
    properties: {align: right, font_size: 18, text: 'Loan Amount:'}
    type: Label
  - layout_properties: {grid_position: 'SXXTDH,QBDMEL UHMPIX,JRUFMH'}
    name: label_5
    properties: {align: right, font_size: 16, text: 'Loan Interest Rate:'}
    type: Label
  - layout_properties: {grid_position: 'SXXTDH,QBDMEL WTDSOA,EIEFDP'}
    name: label_3
    properties: {align: right, font_size: 18, text: 'Any defaults on file?'}
    type: Label
  - data_bindings: []
    layout_properties: {grid_position: 'SXXTDH,BGVBND UFYOHZ,EVADXU'}
    name: loan_amount
    properties: {font_size: 16, placeholder: integer only}
    type: TextBox
  - layout_properties: {grid_position: 'SXXTDH,BGVBND UJZCCJ,WNZBYP'}
    name: int_rate
    properties: {placeholder: '00.00'}
    type: TextBox
  - data_bindings: []
    layout_properties: {grid_position: 'SXXTDH,BGVBND MMEXMB,SJNEAP'}
    name: default
    properties:
      include_placeholder: true
      items: ['[("Yes", 0), ("No",1)]']
      placeholder: Select yes or no
    type: DropDown
  - layout_properties: {grid_position: 'SXXTDH,XEJKTP YYUVTQ,SNFZSW'}
    name: label_2
    properties: {align: right, font_size: 18, text: 'Annual Income:'}
    type: Label
  - layout_properties: {grid_position: 'SXXTDH,XEJKTP IJIJMJ,WQCQFT'}
    name: label_4
    properties: {align: right, font_size: 18, text: 'Home Ownership Status:'}
    type: Label
  - layout_properties: {grid_position: 'SXXTDH,SRZJQM ZMEFTT,VTEJYL'}
    name: income
    properties: {placeholder: integer only}
    type: TextBox
  - layout_properties: {grid_position: 'SXXTDH,SRZJQM XVCIXM,XBTRRU'}
    name: homeownership
    properties:
      include_placeholder: true
      items: [rent, own, mortgage]
      placeholder: Select Status
    type: DropDown
  - event_bindings: {click: submit_click}
    layout_properties: {grid_position: 'WQYVPF,DMAIHI'}
    name: submit
    properties: {role: outlined-button, text: Submit}
    type: Button
  - layout_properties: {grid_position: 'NNOSVQ,CRCNIT'}
    name: loan_status
    properties: {align: center, visible: false}
    type: Label
  layout_properties: {grid_position: ''}
  name: outlined_card_1
  properties: {role: outlined-card}
  type: ColumnPanel
container: {type: ColumnPanel}
is_package: true
